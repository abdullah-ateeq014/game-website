<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Play & Compete</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        /* Login Screen */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #667eea;
            font-size: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .toggle-form button {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }

        /* Main Dashboard */
        .dashboard {
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 32px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info span {
            font-size: 16px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .logout-btn:hover {
            transform: scale(1.05);
        }

        .main-content {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .games-section {
            flex: 1;
        }

        .assistant-section {
            width: 350px;
        }

        .section-title {
            color: white;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .game-card.locked {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .game-card.locked:hover {
            transform: none;
        }

        .game-icon {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .game-info {
            padding: 15px;
        }

        .game-info h3 {
            margin-bottom: 8px;
            color: #333;
        }

        .game-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .game-status {
            display: flex;
            gap: 8px;
            font-size: 12px;
        }

        .badge {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge.locked {
            background: #ccc;
        }

        .badge.premium {
            background: #ff6b6b;
        }

        /* Assistant Box */
        .assistant-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            height: 600px;
            overflow: hidden;
        }

        .assistant-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
        }

        .assistant-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 12px;
            border-radius: 8px;
            max-width: 90%;
            word-wrap: break-word;
        }

        .message.assistant {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
        }

        .message.user {
            background: #667eea;
            color: white;
            align-self: flex-end;
        }

        .assistant-input {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #e0e0e0;
        }

        .assistant-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .assistant-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        .assistant-input button {
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .assistant-input button:hover {
            background: #764ba2;
        }

        /* Game Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease-out;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #667eea;
        }

        .modal-content p {
            margin-bottom: 15px;
            line-height: 1.6;
            color: #666;
        }

        .close-btn {
            float: right;
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            border: none;
            background: none;
        }

        .close-btn:hover {
            color: #000;
        }

        .play-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .play-btn:hover {
            opacity: 0.9;
        }

        .play-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }

            .assistant-section {
                width: 100%;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Authentication System
        class Auth {
            constructor() {
                this.users = this.loadUsers();
            }

            loadUsers() {
                const stored = localStorage.getItem('gamehub_users');
                return stored ? JSON.parse(stored) : {
                    'demo@example.com': {
                        password: 'demo123',
                        name: 'Demo User',
                        premiumGames: ['tictactoe', 'memory', 'snake'],
                        createdAt: new Date('2024-01-01')
                    }
                };
            }

            saveUsers() {
                localStorage.setItem('gamehub_users', JSON.stringify(this.users));
            }

            register(email, password, name) {
                if (this.users[email]) {
                    return { success: false, message: 'Email already exists' };
                }
                if (password.length < 6) {
                    return { success: false, message: 'Password must be at least 6 characters' };
                }
                
                this.users[email] = {
                    password: password,
                    name: name,
                    premiumGames: [],
                    createdAt: new Date()
                };
                this.saveUsers();
                return { success: true, message: 'Registration successful!' };
            }

            login(email, password) {
                if (!this.users[email]) {
                    return { success: false, message: 'Email not found' };
                }
                if (this.users[email].password !== password) {
                    return { success: false, message: 'Incorrect password' };
                }
                
                const user = this.users[email];
                const userData = {
                    email: email,
                    name: user.name,
                    premiumGames: user.premiumGames
                };
                
                localStorage.setItem('gamehub_currentUser', JSON.stringify(userData));
                return { success: true, message: 'Login successful!', user: userData };
            }

            logout() {
                localStorage.removeItem('gamehub_currentUser');
            }

            getCurrentUser() {
                const stored = localStorage.getItem('gamehub_currentUser');
                return stored ? JSON.parse(stored) : null;
            }

            isPremium(gameId) {
                const user = this.getCurrentUser();
                return user && user.premiumGames.includes(gameId);
            }

            addPremiumGame(email, gameId) {
                if (this.users[email]) {
                    if (!this.users[email].premiumGames.includes(gameId)) {
                        this.users[email].premiumGames.push(gameId);
                        this.saveUsers();
                        
                        const currentUser = this.getCurrentUser();
                        if (currentUser && currentUser.email === email) {
                            currentUser.premiumGames.push(gameId);
                            localStorage.setItem('gamehub_currentUser', JSON.stringify(currentUser));
                        }
                    }
                }
            }
        }

        const auth = new Auth();

        // Games Database
        const GAMES_DATABASE = [
            {
                id: 'tictactoe',
                name: 'Tic Tac Toe',
                emoji: '⭕',
                description: 'Classic Tic Tac Toe game. Play against AI or a friend.',
                isPremium: false,
                rules: 'Place your mark (X or O) on a 3x3 grid. Get 3 in a row to win!'
            },
            {
                id: 'memory',
                name: 'Memory Game',
                emoji: '🧠',
                description: 'Match pairs of cards. Test your memory skills!',
                isPremium: false,
                rules: 'Flip cards to find matching pairs. The game ends when all pairs are found.'
            },
            {
                id: 'snake',
                name: 'Snake Game',
                emoji: '🐍',
                description: 'Classic snake game. Eat food and grow longer!',
                isPremium: true,
                rules: 'Control the snake with arrow keys. Eat food to grow. Avoid hitting walls!'
            },
            {
                id: 'flappybird',
                name: 'Flappy Bird',
                emoji: '🐦',
                description: 'Navigate through obstacles. Tap to fly!',
                isPremium: true,
                rules: 'Click to make the bird fly. Avoid the pipes!'
            },
            {
                id: 'breakout',
                name: 'Breakout',
                emoji: '🧱',
                description: 'Bounce ball to break all bricks.',
                isPremium: true,
                rules: 'Move the paddle and bounce the ball to destroy all bricks.'
            },
            {
                id: 'trivia',
                name: 'Trivia Quiz',
                emoji: '🧉',
                description: 'Answer trivia questions and earn points!',
                isPremium: false,
                rules: 'Answer 10 questions correctly to complete the game.'
            },
            {
                id: '2048',
                name: '2048',
                emoji: '🎮',
                description: 'Combine tiles to reach 2048!',
                isPremium: true,
                rules: 'Slide tiles to combine numbers. Reach 2048 to win!'
            },
            {
                id: 'hangman',
                name: 'Hangman',
                emoji: '🎯',
                description: 'Guess the word before running out of tries.',
                isPremium: false,
                rules: 'Guess letters to reveal the hidden word. You have 6 attempts.'
            }
        ];

        class GamesManager {
            constructor() {
                this.games = GAMES_DATABASE;
            }

            getAllGames() {
                return this.games;
            }

            getAvailableGames(user) {
                if (!user) {
                    return this.games.filter(game => !game.isPremium);
                }
                
                return this.games.filter(game => 
                    !game.isPremium || user.premiumGames.includes(game.id)
                );
            }

            getPremiumGames() {
                return this.games.filter(game => game.isPremium);
            }

            getGameById(id) {
                return this.games.find(game => game.id === id);
            }

            canPlayGame(gameId, user) {
                const game = this.getGameById(gameId);
                if (!game) return false;
                
                if (!game.isPremium) return true;
                
                return user && user.premiumGames.includes(gameId);
            }
        }

        const gamesManager = new GamesManager();

        // AI Assistant
        class Assistant {
            constructor() {
                this.messages = [];
                this.responses = this.getResponses();
            }

            getResponses() {
                return {
                    'hello': 'Hi there! 👋 Welcome to GameHub. I\'m your gaming assistant. How can I help you today?',
                    'help': 'I can help you with:\n- Game recommendations\n- How to play games\n- Unlocking premium games\n- General gaming tips',
                    'games': 'We have 8 amazing games available! Free games include Tic Tac Toe, Memory Game, Trivia, and Hangman. Premium games include Snake, Flappy Bird, Breakout, and 2048.',
                    'premium': 'Premium games are exclusive features available to registered users! When you log in, you unlock access to more games. Demo users already have access to several premium games.',
                    'recommend': 'Based on your profile, I recommend starting with Memory Game for a casual experience, or try Trivia for something challenging!',
                    'how to': 'Which game would you like help with? Try asking about Tic Tac Toe, Snake, Flappy Bird, or any other game!',
                    'unlock': 'To unlock premium games, make sure you\'re logged in! Premium members get instant access to all exclusive games.',
                    'play': 'Pick a game from the grid on the left! Click on any game card to start playing. You can play multiple games in one session!',
                    'score': 'Keep playing to improve your scores! I\'ll track your progress as you play more games.',
                    'tips': 'Gaming Tips:\n- Start with easier games to build confidence\n- Practice makes perfect\n- Challenges make the game more fun\n- Have fun and enjoy!',
                    'default': 'That\'s interesting! 🎮 Try asking me about specific games or how to play them.'
                };
            }

            addMessage(text, isUser = true) {
                this.messages.push({ text, isUser, timestamp: new Date() });
            }

            getResponse(userMessage) {
                const message = userMessage.toLowerCase().trim();
                
                for (const [keyword, response] of Object.entries(this.responses)) {
                    if (message.includes(keyword)) {
                        return response;
                    }
                }
                
                const gameKeywords = {
                    'tic tac': 'Tic Tac Toe is a classic game! Place your X or O on a 3x3 grid and try to get 3 in a row. Great for quick games!',
                    'memory': 'Memory Game is fantastic for training your brain! Flip cards and find matching pairs. Perfect for all ages!',
                    'snake': 'Snake is a classic arcade game! Control the snake, eat food, and try to grow as long as possible. Premium game!',
                    'flappy': 'Flappy Bird is a challenging game! Click to make the bird fly and avoid the pipes. Can you beat the high score?',
                    'breakout': 'Breakout is an action-packed game! Use the paddle to bounce the ball and destroy bricks. Great reflexes builder!',
                    'trivia': 'Trivia Quiz is perfect for testing your knowledge! Answer questions and earn points. Free to play!',
                    '2048': '2048 is a puzzle game where you combine tiles to reach 2048! It\'s challenging and addictive.',
                    'hangman': 'Hangman is a word-guessing game! Guess letters to reveal the hidden word before you run out of attempts.'
                };
                
                for (const [game, response] of Object.entries(gameKeywords)) {
                    if (message.includes(game)) {
                        return response;
                    }
                }
                
                return this.responses['default'];
            }

            getMessages() {
                return this.messages;
            }
        }

        const assistant = new Assistant();

        // Main App
        class GameHubApp {
            constructor() {
                this.currentUser = auth.getCurrentUser();
                this.currentGame = null;
                this.init();
            }

            init() {
                const app = document.getElementById('app');
                if (this.currentUser) {
                    this.showDashboard();
                } else {
                    this.showLoginForm();
                }
            }

            showLoginForm() {
                const app = document.getElementById('app');
                let isLogin = true;

                app.innerHTML = `
                    <div class="login-container">
                        <div class="login-box">
                            <h1>🎮 GameHub</h1>
                            <form id="authForm">
                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" required>
                                </div>
                                <div class="form-group">
                                    <label for="password">Password</label>
                                    <input type="password" id="password" required>
                                </div>
                                <div class="form-group" id="nameGroup" style="display: none;">
                                    <label for="name">Full Name</label>
                                    <input type="text" id="name">
                                </div>
                                <button type="submit" class="login-btn" id="submitBtn">Login</button>
                            </form>
                            <div class="toggle-form">
                                Don't have an account? <button id="toggleBtn">Sign up here</button>
                            </div>
                            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e0e0; text-align: center; color: #666;">
                                <p style="margin-bottom: 10px;"><strong>Demo Account:</strong></p>
                                <p>Email: demo@example.com</p>
                                <p>Password: demo123</p>
                            </div>
                        </div>
                    </div>
                `;

                const form = document.getElementById('authForm');
                const toggleBtn = document.getElementById('toggleBtn');
                const nameGroup = document.getElementById('nameGroup');
                const submitBtn = document.getElementById('submitBtn');

                toggleBtn.addEventListener('click', () => {
                    isLogin = !isLogin;
                    nameGroup.style.display = isLogin ? 'none' : 'block';
                    submitBtn.textContent = isLogin ? 'Login' : 'Sign Up';
                    toggleBtn.textContent = isLogin ? 'Sign up here' : 'Login here';
                    document.querySelector('.toggle-form').textContent = isLogin ? "Don't have an account? " : 'Already have an account? ';
                    document.querySelector('.toggle-form').appendChild(toggleBtn);
                });

                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const name = document.getElementById('name').value;

                    if (isLogin) {
                        const result = auth.login(email, password);
                        if (result.success) {
                            this.currentUser = result.user;
                            this.showDashboard();
                        } else {
                            alert(result.message);
                        }
                    } else {
                        const result = auth.register(email, password, name);
                        if (result.success) {
                            alert(result.message);
                            const loginResult = auth.login(email, password);
                            this.currentUser = loginResult.user;
                            this.showDashboard();
                        } else {
                            alert(result.message);
                        }
                    }
                });
            }

            showDashboard() {
                const app = document.getElementById('app');
                const availableGames = gamesManager.getAvailableGames(this.currentUser);
                const premiumGames = gamesManager.getPremiumGames();
                const lockedGames = premiumGames.filter(g => !this.currentUser.premiumGames.includes(g.id));

                app.innerHTML = `
                    <div class="dashboard">
                        <div class="header">
                            <div>
                                <h1>🎮 GameHub</h1>
                                <p style="color: rgba(255,255,255,0.8); margin-top: 5px;">Welcome to the ultimate gaming platform</p>
                            </div>
                            <div class="user-info">
                                <div>
                                    <p>👤 ${this.currentUser.name}</p>
                                    <p style="font-size: 12px; margin-top: 5px;">${this.currentUser.email}</p>
                                </div>
                                <button class="logout-btn" id="logoutBtn">Logout</button>
                            </div>
                        </div>

                        <div class="main-content">
                            <div class="games-section">
                                <h2 class="section-title">Available Games (${availableGames.length})</h2>
                                <div class="games-grid" id="gamesGrid"></div>
                                
                                ${lockedGames.length > 0 ? `
                                    <h2 class="section-title" style="margin-top: 40px;">Locked Games - Login to Unlock 🔒</h2>
                                    <div class="games-grid" id="lockedGamesGrid"></div>
                                ` : ''}
                            </div>

                            <div class="assistant-section">
                                <h2 class="section-title">🤖 Gaming Assistant</h2>
                                <div class="assistant-box">
                                    <div class="assistant-header">AI Gaming Assistant</div>
                                    <div class="assistant-messages" id="assistantMessages">
                                        <div class="message assistant">👋 Hi! I'm your gaming assistant. Ask me anything about our games or gaming tips!</div>
                                    </div>
                                    <div class="assistant-input">
                                        <input type="text" id="assistantInput" placeholder="Ask me anything...">
                                        <button id="assistantSendBtn">Send</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal" id="gameModal">
                        <div class="modal-content" id="modalContent">
                            <button class="close-btn" id="closeModalBtn">&times;</button>
                            <div id="gameDetails"></div>
                        </div>
                    </div>
                `;

                const gamesGrid = document.getElementById('gamesGrid');
                availableGames.forEach(game => {
                    gamesGrid.appendChild(this.createGameCard(game, false));
                });

                if (lockedGames.length > 0) {
                    const lockedGamesGrid = document.getElementById('lockedGamesGrid');
                    lockedGames.forEach(game => {
                        lockedGamesGrid.appendChild(this.createGameCard(game, true));
                    });
                }

                const assistantInput = document.getElementById('assistantInput');
                const assistantSendBtn = document.getElementById('assistantSendBtn');
                const assistantMessages = document.getElementById('assistantMessages');

                const sendMessage = () => {
                    const message = assistantInput.value.trim();
                    if (message) {
                        const userMsgEl = document.createElement('div');
                        userMsgEl.className = 'message user';
                        userMsgEl.textContent = message;
                        assistantMessages.appendChild(userMsgEl);

                        setTimeout(() => {
                            const response = assistant.getResponse(message);
                            const assistantMsgEl = document.createElement('div');
                            assistantMsgEl.className = 'message assistant';
                            assistantMsgEl.textContent = response;
                            assistantMessages.appendChild(assistantMsgEl);
                            assistantMessages.scrollTop = assistantMessages.scrollHeight;
                        }, 500);

                        assistantInput.value = '';
                        assistantMessages.scrollTop = assistantMessages.scrollHeight;
                    }
                };

                assistantSendBtn.addEventListener('click', sendMessage);
                assistantInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') sendMessage();
                });

                document.getElementById('logoutBtn').addEventListener('click', () => {
                    auth.logout();
                    this.currentUser = null;
                    this.showLoginForm();
                });

                const modal = document.getElementById('gameModal');
                const closeModalBtn = document.getElementById('closeModalBtn');
                
                closeModalBtn.addEventListener('click', () => {
                    modal.classList.remove('active');
                });

                window.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.classList.remove('active');
                    }
                });
            }

            createGameCard(game, isLocked) {
                const card = document.createElement('div');
                card.className = `game-card ${isLocked ? 'locked' : ''}`;
                card.innerHTML = `
                    <div class="game-icon">${game.emoji}</div>
                    <div class="game-info">
                        <h3>${game.name}</h3>
                        <p>${game.description}</p>
                        <div class="game-status">
                            ${game.isPremium && !isLocked ? '<span class="badge premium">Premium</span>' : ''}
                            ${isLocked ? '<span class="badge locked">Locked</span>' : '<span class="badge">Free</span>'}
                        </div>
                    </div>
                `;

                if (!isLocked) {
                    card.addEventListener('click', () => this.showGameModal(game));
                }

                return card;
            }

            showGameModal(game) {
                const modal = document.getElementById('gameModal');
                const gameDetails = document.getElementById('gameDetails');

                gameDetails.innerHTML = `
                    <h2>${game.emoji} ${game.name}</h2>
                    <p><strong>Description:</strong> ${game.description}</p>
                    <p><strong>How to play:</strong> ${game.rules}</p>
                    ${game.isPremium ? '<p style="color: #ff6b6b;"><strong>⭐ Premium Game - Available to registered users</strong></p>' : ''}
                    <button class="play-btn" id="playBtn">▶️ Play Now</button>
                `;

                const playBtn = document.getElementById('playBtn');
                playBtn.addEventListener('click', () => {
                    alert(`🎮 Starting ${game.name}!\n\n${game.rules}\n\nIn a full application, this would launch the game!`);
                    modal.classList.remove('active');
                });

                modal.classList.add('active');
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                new GameHubApp();
            });
        } else {
            new GameHubApp();
        }
    </script>
</body>
</html>
